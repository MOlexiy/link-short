name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # mongodb-memory-server downloads a MongoDB binary on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  # Runs only when the AWS_ROLE_ARN repository variable is configured
  # (GitHub OIDC → IAM role, no long-lived AWS keys in secrets).
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    concurrency: deploy-production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - run: npx sst deploy --stage production

      # Indexes are managed explicitly (autoIndex is off in Lambda).
      - run: npm run db:indexes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
